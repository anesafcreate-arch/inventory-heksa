<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} | HEKSA Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', path='img/heksa-logo.png') }}?v=2">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body class="login-body">
    <main class="error-shell glass-card">
        <img src="{{ url_for('static', path='img/heksa-logo.png') }}?v=2" alt="Heksa Instrumen Sinergi">
        <strong>{{ status_code }}</strong>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="primary-button action-link" href="/dashboard">Kembali ke Dashboard</a>
    </main>
</body>
</html>
